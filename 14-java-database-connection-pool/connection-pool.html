<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Connection Pool</title><style>body{font-family:system-ui;max-width:900px;margin:30px auto;padding:20px;background:#f5f5f5}.card,.slot,.worker{background:white;border:2px solid #555;border-radius:14px;padding:18px;margin:12px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.arrow{font-size:26px}.empty{border-style:dashed}</style><h1>Connection Pool = DB接続の貸出棚</h1><div class="card"><div class="row"><div class="worker">Worker 1</div><span class="arrow">→ 借りる</span><div class="slot">Connection A</div><span>→ DB</span></div><div class="row"><div class="worker">Worker 2</div><span class="arrow">→ 借りる</span><div class="slot">Connection B</div></div><div class="row"><div class="worker">Worker 3</div><span class="arrow">→</span><div class="slot empty">空き待ち</div></div></div><div class="card"><h2>close()</h2><p>Pool管理下では、アプリから見たcloseが「次の人へ貸せる状態に返す」動作になる。</p></div><div class="card"><h2>全体</h2><p>Request → Thread → DataSource → Pool → Connection → DB</p></div></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>JVM / GC</title><style>body{font-family:system-ui;max-width:950px;margin:30px auto;padding:20px;background:#f5f5f5}.zone{background:white;border:2px solid #555;border-radius:16px;padding:20px;margin:16px}.row{display:flex;gap:20px;flex-wrap:wrap}.obj{border:2px solid #555;border-radius:10px;padding:12px;margin:8px}.garbage{border-style:dashed;opacity:.65}</style><h1>JVMメモリを部屋として見る</h1><div class="row"><div class="zone"><h2>Stack = 作業机</h2><div class="obj">user reference ───→</div><div class="obj">temporary = null</div></div><div class="zone"><h2>Heap = objectの部屋</h2><div class="obj">User object ← 到達できる</div><div class="obj garbage">temporary object<br>到達できない<br>→ GC eligible</div></div></div><div class="zone"><h2>GC</h2><p>「古い物」ではなく、まず<strong>生きている参照から辿れるか</strong>で考える。</p><p>参照を失う → 回収候補 → GCが適切なタイミングで処理。</p></div><div class="zone"><h2>実行まで</h2><p>.java → javac → bytecode → JVM → interpreter / JIT → CPU</p></div></html>
